
set timeout=3
set default=LiveCD

clear

menuentry 'Ventoy 1.1.18 LiveCD GUI' --id=LiveCD {
    echo downloading kernel ...
    linux  /EFI/VToy/vmlinuz quiet first_run rdinit=/VTOY/init
    
    echo downloading initrd ...
    initrd /EFI/VToy/initrd
    
    echo booting LiveCD ...
    boot
}

menuentry 'Ventoy 1.1.18 LiveCD GUI (Debug Mode)' { 
    echo downloading kernel ...
    linux  /EFI/VToy/vmlinuz debug loglevel=7 first_run rdinit=/VTOY/init
    
    echo downloading initrd ...
    initrd /EFI/VToy/initrd
    
    echo booting LiveCD ...
    boot
}
